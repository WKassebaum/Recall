# SemVecMem Configuration

# EMBEDDER CONFIGURATION (sentence-transformers via HuggingFace)
embedder:
  model: nomic-ai/nomic-embed-text-v1.5  # 768D, CPU-optimized
  # Model is auto-downloaded and cached at ~/.cache/huggingface/hub/

# 2-TIER FALLBACK (Zen validated, 9/10 confidence)
fallback:
  enabled: true
  model: all-MiniLM-L6-v2  # 78.1% accuracy, 384D (most reliable)

# USER-SELECTABLE ALTERNATIVES (manual switch, not auto-fallback)
available_models:
  - snowflake/arctic-embed-m   # 87% - default
  - nomic-embed-text-v1.5      # 86.2% - long context (8K tokens)
  - bge-small-en-v1.5          # 84.7% - balanced
  - all-MiniLM-L6-v2           # 78.1% - speed

# QDRANT CONFIGURATION
# EMBEDDED MODE (default) - Data stored locally in ~/.recall/qdrant/
# No Docker required, data is user-accessible
qdrant:
  mode: embedded  # Use "embedded" (default) or "network" (Docker/remote)
  path: ~/.recall/qdrant/  # Path for embedded mode
  # host: localhost  # For network mode (Docker)
  # port: 6333       # For network mode (Docker)
  # api_key: optional - uncomment and set if using Qdrant Cloud

# MULTI-COLLECTION (auto-managed by UnifiedVectorStore)
collections:
  auto_create: true
  # recall_384d (all-MiniLM-L6-v2, bge-small-en-v1.5)
  # recall_768d (snowflake-arctic-embed-m, nomic-embed-text-v1.5)
  # Collections created automatically based on active embedder dimension

# MONITORING
monitoring:
  alert_on_fallback: true  # Alert when Arctic fails and MiniLM activates
  log_dimension_mismatches: true

# CHUNKING
chunking:
  max_chunk_size: 512  # tokens
  overlap: 50          # tokens
  languages:
    - python
    - javascript
    - typescript

# LOGGING
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
